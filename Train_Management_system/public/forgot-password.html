
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailGo | Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #07152e, #102f57, #087e8b);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-box {
    width: 100%;
    max-width: 450px;
    padding: 36px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
    animation: appear 0.45s ease;
}

.icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    background: linear-gradient(135deg, #087e8b, #1261a0);
    color: #fff;
    font-size: 32px;
}

h2 {
    margin: 0 0 12px;
    font-size: 28px;
    font-weight: 800;
    text-align: center;
    color: #102f57;
}

.description {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.form-label {
    display: block;
    font-size: 14px;
    font-weight: 650;
    color: #26384f;
    margin-bottom: 8px;
}

.form-control {
    width: 100%;
    height: 47px;
    padding: 10px 13px;
    border: 1px solid #dce3ed;
    border-radius: 10px;
    background: #fff;
    color: #17243b;
    font-size: 14px;
    margin-bottom: 17px;
    outline: none;
}

.form-control:focus {
    border-color: #087e8b;
    box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.14);
}

.reset-btn {
    width: 100%;
    min-height: 50px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(100deg, #087e8b, #1261a0);
    color: white;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 5px;
}

.reset-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(8, 126, 139, 0.25);
}

.reset-btn:disabled {
    opacity: 0.7;
    cursor: wait;
    transform: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 23px;
    text-decoration: none;
    color: #087e8b;
    font-size: 14px;
    font-weight: 700;
}

.back:hover {
    color: #1261a0;
    text-decoration: underline;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #8a96a8;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .card-box {
        padding: 28px 22px;
    }
}
</style>
</head>

<body>
<main class="card-box">

    <div class="icon">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2>Forgot Password?</h2>

    <p class="description">
        Enter your admin username and registered email
        to securely reset your password.
    </p>

    <form id="resetForm">
        <label for="username" class="form-label">Admin Username</label>
        <input type="text" id="username" class="form-control"
               placeholder="Enter admin username" autocomplete="username" required>

        <label for="email" class="form-label">Registered Email</label>
        <input type="email" id="email" class="form-control"
               placeholder="Enter registered email" autocomplete="email" required>

        <label for="newPassword" class="form-label">New Password</label>
        <input type="password" id="newPassword" class="form-control"
               placeholder="At least 6 characters" minlength="6"
               autocomplete="new-password" required>

        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control"
               placeholder="Re-enter new password" minlength="6"
               autocomplete="new-password" required>

        <button type="submit" class="reset-btn" id="resetButton">
            <i class="bi bi-key-fill"></i> &nbsp; Reset Password
        </button>
    </form>

    <a href="admin-login.html" class="back">
        <i class="bi bi-arrow-left"></i> &nbsp; Back to Admin Login
    </a>

    <div class="footer">RailGo Railway Management System © 2026</div>
</main>

<script>
document.getElementById("resetForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const button = document.getElementById("resetButton");

    if (newPassword !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    if (newPassword.length < 6) {
        alert("Password must contain at least 6 characters.");
        return;
    }

    button.disabled = true;
    button.innerHTML = '<i class="bi bi-arrow-repeat"></i> Resetting...';

    try {
        const response = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: username,
                email: email,
                newPassword: newPassword
            })
        });

        const data = await response.json();

        if (response.ok) {
            alert("Password reset successfully!");
            window.location.href = "admin-login.html";
        } else {
            alert(data.message || "Unable to reset password.");
        }
    } catch (error) {
        console.error(error);
        alert("Cannot connect to the server. Make sure server.js is running.");
    } finally {
        button.disabled = false;
        button.innerHTML = '<i class="bi bi-key-fill"></i> &nbsp; Reset Password';
    }
});
</script>
</body>
</html>
