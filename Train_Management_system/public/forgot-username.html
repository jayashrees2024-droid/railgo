
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailGo | Forgot Username</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #07152e, #102f57, #087e8b);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 450px;
    padding: 40px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 25px 70px rgba(0,0,0,.3);
    animation: appear .45s ease;
}

.logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 22px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 35px;
    background: linear-gradient(135deg, #087e8b, #1261a0);
}

h1 {
    text-align: center;
    color: #102f57;
    font-size: 29px;
    font-weight: 800;
    margin: 0 0 12px;
}

.description {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 28px;
}

label {
    display: block;
    color: #26384f;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 9px;
}

input {
    display: block;
    width: 100%;
    height: 50px;
    padding: 0 15px;
    border: 1px solid #dce3ed;
    border-radius: 11px;
    background: #ffffff;
    color: #17243b;
    font-size: 15px;
    outline: none;
    margin-bottom: 18px;
}

input:focus {
    border-color: #087e8b;
    box-shadow: 0 0 0 3px rgba(8,126,139,.15);
}

button {
    width: 100%;
    min-height: 51px;
    border: none;
    border-radius: 11px;
    color: #ffffff;
    background: linear-gradient(100deg, #087e8b, #1261a0);
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(8,126,139,.25);
}

button:disabled {
    opacity: .7;
    cursor: wait;
    transform: none;
}

.result {
    display: none;
    padding: 14px;
    margin-top: 18px;
    border-radius: 10px;
    overflow-wrap: anywhere;
    font-size: 14px;
    line-height: 1.6;
}

.success {
    display: block;
    color: #087e8b;
    background: #e6f7f4;
    border: 1px solid #8ad9ce;
}

.error {
    display: block;
    color: #b42318;
    background: #fff0f0;
    border: 1px solid #f2b8b5;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #087e8b;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
}

.back:hover { text-decoration: underline; }

.footer {
    text-align: center;
    color: #8a96a8;
    font-size: 12px;
    margin-top: 28px;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .card { padding: 30px 23px; }
}
</style>
</head>

<body>
<main class="card">

    <div class="logo">
        <i class="bi bi-train-front-fill"></i>
    </div>

    <h1>Forgot Username?</h1>

    <p class="description">
        No worries! Enter your registered email address
        and we'll help you find your username.
    </p>

    <form id="forgotForm">
        <label for="email">Registered Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required>

        <button type="submit" id="findButton">
            <i class="bi bi-search"></i>
            &nbsp; Find Username
        </button>
    </form>

    <div id="result" class="result" role="status" aria-live="polite"></div>

    <a href="admin-login.html" class="back">
        <i class="bi bi-arrow-left"></i>
        &nbsp; Back to Admin Login
    </a>

    <div class="footer">RailGo Railway Management System © 2026</div>
</main>

<script>
const form = document.getElementById("forgotForm");
const result = document.getElementById("result");
const button = document.getElementById("findButton");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    result.style.display = "none";
    button.disabled = true;
    button.innerHTML =
        '<i class="bi bi-arrow-repeat"></i> Searching...';

    try {
        const response = await fetch("/api/auth/forgot-username", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value.trim()
            })
        });

        const data = await response.json();

        result.className = "result " + (response.ok ? "success" : "error");
        result.textContent = response.ok
            ? "Your username is: " + data.username
            : (data.message || "Could not find a username for this email.");
        result.style.display = "block";

    } catch (error) {
        result.className = "result error";
        result.textContent =
            "Cannot connect to the server. Check that server.js is running.";
        result.style.display = "block";
    } finally {
        button.disabled = false;
        button.innerHTML =
            '<i class="bi bi-search"></i> &nbsp; Find Username';
    }
});
</script>
</body>
</html>
