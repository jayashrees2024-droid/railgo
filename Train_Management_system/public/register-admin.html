<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Admin - Train Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
        }

        .card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 12px;
        }

        .form-control {
            padding: 12px;
        }

        .btn {
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container p-3">

        <div class="card shadow-lg p-4 mx-auto">

            <h2 class="text-center mb-4">
                Create Admin Account
            </h2>

            <div id="message" class="alert d-none" role="alert"></div>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter email"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        minlength="6"
                        autocomplete="new-password"
                        required>
                </div>

                <button
                    type="submit"
                    id="registerButton"
                    class="btn btn-primary w-100">

                    Create Admin

                </button>

            </form>

            <div class="text-center mt-3">
                <a href="index.html">Back to Login</a>
            </div>

        </div>

    </div>

    <script>
        const form = document.getElementById("registerForm");
        const button = document.getElementById("registerButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert alert-" + type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            if (!username || !email || !password) {
                showMessage("Please fill in all fields.", "warning");
                return;
            }

            button.disabled = true;
            button.textContent = "Creating Admin...";
            showMessage("Connecting to the server...", "info");

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const contentType =
                    response.headers.get("content-type") || "";

                let data;

                if (contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    throw new Error(
                        text || "The server returned an unexpected response."
                    );
                }

                if (!response.ok) {
                    throw new Error(
                        data.message || "Admin registration failed."
                    );
                }

                showMessage(
                    data.message || "Admin account created successfully!",
                    "success"
                );

                form.reset();

                button.textContent = "Admin Created";

                setTimeout(function () {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error("Admin registration error:", error);

                showMessage(
                    error.message.includes("Failed to fetch")
                        ? "Cannot connect to the server. Start Node.js and open this page through localhost."
                        : error.message,
                    "danger"
                );

                button.disabled = false;
                button.textContent = "Create Admin";
            }
        });
    </script>

</body>

</html>
