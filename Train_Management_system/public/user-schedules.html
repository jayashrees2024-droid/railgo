
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailGo | Train Schedules</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f3f6fc;
            color: #17233f;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar {
            background: #101d3b;
            padding: 16px 3%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            color: white;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        .brand i {
            color: #60a5fa;
            margin-right: 10px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }

        .nav-links a {
            color: #e3eaff;
            font-size: 14px;
            text-decoration: none;
        }

        .nav-links a:hover { color: #93c5fd; }

        .page {
            width: 100%;
            padding: 35px 3%;
        }

        .hero {
            padding: 35px;
            border-radius: 20px;
            color: white;
            background: linear-gradient(120deg, #101d3b, #2563eb);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: clamp(26px, 3vw, 38px);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero p {
            margin: 0;
            color: #e0eaff;
        }

        .hero-icon {
            font-size: 75px;
            color: #ffffffc9;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .toolbar h2 {
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .toolbar p {
            color: #78859b;
            font-size: 13px;
            margin: 0;
        }

        .search {
            width: min(100%, 380px);
            padding: 12px 15px;
            border: 1px solid #dce4f0;
            border-radius: 10px;
            outline: none;
            background: white;
        }

        .search:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #2563eb18;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .schedule-card {
            background: white;
            border: 1px solid #e3eaf4;
            border-radius: 17px;
            padding: 25px;
            box-shadow: 0 5px 20px #17233f08;
            transition: .2s;
        }

        .schedule-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px #17233f10;
        }

        .train-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px dashed #dbe3ef;
        }

        .train-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: #eaf2ff;
            color: #2563eb;
            font-size: 21px;
            margin-right: 12px;
        }

        .train-name {
            font-size: 18px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .train-number {
            color: #8490a5;
            font-size: 13px;
            margin-top: 4px;
        }

        .status {
            padding: 7px 12px;
            background: #dcfce7;
            color: #15803d;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
        }

        .status.delayed {
            background: #fef3c7;
            color: #92400e;
        }

        .status.cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        .route {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 15px;
            align-items: center;
            padding: 24px 0;
        }

        .route h3 {
            font-size: 17px;
            font-weight: 800;
            margin: 7px 0;
            overflow-wrap: anywhere;
        }

        .route small { color: #8490a5; }

        .route-icon {
            color: #2563eb;
            font-size: 20px;
        }

        .destination { text-align: right; }

        .schedule-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 17px;
            background: #f7f9fd;
            border-radius: 12px;
        }

        .detail-label {
            color: #8490a5;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 17px;
            border: 1px solid #e3eaf4;
        }

        .empty i {
            color: #93b7ff;
            font-size: 45px;
            margin-bottom: 18px;
        }

        .empty h3 { font-weight: 800; }

        .footer {
            background: white;
            border-top: 1px solid #e3eaf4;
            padding: 22px 3%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            color: #78859b;
            font-size: 12px;
        }

        @media (max-width: 850px) {
            .schedule-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .page { padding: 20px 4%; }
            .hero { padding: 25px; }
            .hero-icon { display: none; }
            .nav-links { gap: 12px; }
            .schedule-card { padding: 18px; }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="user-dashboard.html" class="brand">
        <i class="fa-solid fa-train"></i>RailGo
    </a>

    <div class="nav-links">
        <a href="user-dashboard.html">Dashboard</a>
        <a href="book-ticket.html">Book a Train</a>
        <a href="user-tickets.html">My Tickets</a>
        <a href="user-schedules.html">Train Schedules</a>
        <a href="user-profile.html">My Profile</a>
    </div>
</nav>

<main class="page">

    <section class="hero">
        <div>
            <h1><i class="fa-solid fa-calendar-days me-2"></i>Train Schedules</h1>
            <p>Explore train routes, journey dates, timings, and schedule status.</p>
        </div>

        <div class="hero-icon">
            <i class="fa-solid fa-train-subway"></i>
        </div>
    </section>

    <section>
        <div class="toolbar">
            <div>
                <h2>Available Schedules</h2>
                <p id="scheduleCount">Loading schedules...</p>
            </div>

            <input
                type="search"
                id="scheduleSearch"
                class="search"
                placeholder="Search train, station or date..."
            >
        </div>

        <div id="message" class="text-danger mb-3"></div>
        <div id="scheduleContainer" class="schedule-grid">
            <div class="empty">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <h3>Loading schedules...</h3>
            </div>
        </div>
    </section>

</main>

<footer class="footer">
    <span><strong>RailGo</strong> — Your journey, your way.</span>
    <span>Passenger Portal &copy; 2026</span>
</footer>

<script>
const scheduleContainer = document.getElementById("scheduleContainer");
const scheduleSearch = document.getElementById("scheduleSearch");
const scheduleCount = document.getElementById("scheduleCount");
const message = document.getElementById("message");

let allSchedules = [];

function safe(value) {
    return String(value ?? "-").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function formatDate(value) {
    if (!value) return "Not specified";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return safe(value);

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function formatTime(value) {
    if (!value) return "Not specified";

    // Handles times stored as HH:mm or as a date/time string.
    if (/^\d{1,2}:\d{2}$/.test(String(value))) {
        return safe(value);
    }

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return safe(value);

    return date.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    });
}

function renderSchedules(schedules) {
    scheduleCount.textContent =
        schedules.length + (schedules.length === 1 ? " schedule found" : " schedules found");

    if (schedules.length === 0) {
        scheduleContainer.className = "";
        scheduleContainer.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-calendar-xmark"></i>
                <h3>No schedules found</h3>
                <p class="text-secondary">
                    No schedules match your search, or no schedules have been added yet.
                </p>
            </div>
        `;
        return;
    }

    scheduleContainer.className = "schedule-grid";

    scheduleContainer.innerHTML = schedules.map(schedule => {
        const status = schedule.scheduleStatus || "Scheduled";
        let statusClass = "";

        if (String(status).toLowerCase() === "delayed") {
            statusClass = "delayed";
        } else if (String(status).toLowerCase() === "cancelled") {
            statusClass = "cancelled";
        }

        return `
            <article class="schedule-card">
                <div class="train-heading">
                    <div class="d-flex align-items-center">
                        <div class="train-icon">
                            <i class="fa-solid fa-train"></i>
                        </div>

                        <div>
                            <div class="train-name">${safe(schedule.trainName || "Train")}</div>
                            <div class="train-number">
                                Train No: ${safe(schedule.trainNumber)}
                            </div>
                        </div>
                    </div>

                    <span class="status ${statusClass}">${safe(status)}</span>
                </div>

                <div class="route">
                    <div>
                        <small>FROM</small>
                        <h3>${safe(schedule.source)}</h3>
                        <small>
                            <i class="fa-solid fa-clock me-1"></i>
                            ${formatTime(schedule.departureTime)}
                        </small>
                    </div>

                    <div class="route-icon">
                        <i class="fa-solid fa-arrow-right-long"></i>
                    </div>

                    <div class="destination">
                        <small>TO</small>
                        <h3>${safe(schedule.destination)}</h3>
                        <small>
                            <i class="fa-solid fa-clock me-1"></i>
                            ${formatTime(schedule.arrivalTime)}
                        </small>
                    </div>
                </div>

                <div class="schedule-details">
                    <div>
                        <div class="detail-label">Journey Date</div>
                        <div class="detail-value">
                            <i class="fa-regular fa-calendar me-1 text-primary"></i>
                            ${formatDate(schedule.journeyDate)}
                        </div>
                    </div>

                    <div>
                        <div class="detail-label">Schedule Status</div>
                        <div class="detail-value">${safe(status)}</div>
                    </div>
                </div>
            </article>
        `;
    }).join("");
}

async function loadSchedules() {
    message.textContent = "";

    try {
        // Uses the existing schedules API from the project.
        const response = await fetch("/api/schedules");

        if (!response.ok) {
            throw new Error("Could not load schedules from the server.");
        }

        const data = await response.json();

        // Supports APIs that return either an array or { schedules: [...] }.
        const schedules = Array.isArray(data)
            ? data
            : Array.isArray(data.schedules)
                ? data.schedules
                : null;

        if (!schedules) {
            throw new Error("The schedules API did not return a schedule list.");
        }

        allSchedules = schedules;
        filterSchedules();

    } catch (error) {
        scheduleCount.textContent = "Schedules unavailable";
        message.textContent = error.message;

        scheduleContainer.className = "";
        scheduleContainer.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h3>Unable to load schedules</h3>
                <p class="text-secondary">
                    Check that your Node.js server is running and the schedules API is available.
                </p>
                <button class="btn btn-primary mt-2" onclick="loadSchedules()">
                    Try Again
                </button>
            </div>
        `;
    }
}

function filterSchedules() {
    const query = scheduleSearch.value.toLowerCase().trim();

    const filtered = allSchedules.filter(schedule => {
        const searchable = [
            schedule.trainName,
            schedule.trainNumber,
            schedule.source,
            schedule.destination,
            schedule.journeyDate,
            schedule.scheduleStatus
        ].join(" ").toLowerCase();

        return searchable.includes(query);
    });

    renderSchedules(filtered);
}

scheduleSearch.addEventListener("input", filterSchedules);

loadSchedules();
</script>

</body>
</html>
